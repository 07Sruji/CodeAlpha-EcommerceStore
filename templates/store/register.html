```html
{% extends "store/base.html" %}
{% block title %}Create Account — ShopEase{% endblock %}

{% block content %}

<div class="auth-page">
    <div class="auth-card">

        <span class="brand-center">S</span>
        <span class="eyebrow">JOIN SHOP-EASE</span>

        <h1>Create account</h1>
        <p>Save your orders and checkout faster.</p>

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <label>
                Username
                <input
                    type="text"
                    name="username"
                    autocomplete="off"
                    required
                >
            </label>

            <label>
                Email
                <input
                    type="email"
                    name="email"
                    autocomplete="off"
                    required
                >
            </label>

            <label>
                Password
                <div class="password-wrapper">
                    <input
                        type="password"
                        name="password"
                        id="password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>
                </div>
            </label>

            <label>
                Confirm password
                <div class="password-wrapper">
                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password"
                    >
                        👁️
                    </button>
                </div>
            </label>

            <button type="submit" class="btn btn-dark btn-full">
                Create Account
            </button>

        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="{% url 'login' %}">Sign in</a>
        </p>

    </div>
</div>

<script>
function togglePassword(inputId, button) {
    const password = document.getElementById(inputId);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");
    } else {
        password.type = "password";
        button.textContent = "👁️";
        button.setAttribute("aria-label", "Show password");
    }
}
</script>

{% endblock %}
```
